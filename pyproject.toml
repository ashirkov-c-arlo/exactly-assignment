[project]
name = "solution"
version = "0.1.0"
description = "Bubble illustration quality gate (Runware vision batch reviewer)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "pillow>=10.0",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solution"]
